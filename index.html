<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f7"><title>二线关 · SPECIAL ZONE</title><link rel="stylesheet" href="./room.css?v=3"><script defer src="./room-client.js?v=3"></script><link rel="stylesheet" href="./controls.css?v=1"></head>
<body><main id="entry"><header><b>SPECIAL ZONE</b><a href="./practice.html">旧版单机演练</a></header><h1>二线关</h1><p class="subtitle">1994 深圳经济特区</p><form id="join"><label>昵称<input name="name" maxlength="18" required autocomplete="nickname"></label><p id="invited" hidden></p><label id="codeField">房间号<input name="code" maxlength="8" required autocapitalize="characters" spellcheck="false"></label><button class="primary">加入房间</button><small id="join-error" role="status"></small></form><button id="create">管理员创建房间</button><p class="muted">游戏使用手机定位。管理员与受邀观察席可查看全员位置，玩家按角色规则查看。</p><details open><summary>1994 街道简图</summary><iframe title="地图预览" src="./geo.html?embed=1"></iframe></details></main>
<main id="game" hidden><header><div><small id="identity"></small><strong id="clock">等待开局</strong></div><div><button id="refresh">刷新</button><button id="menu">房间</button></div></header><iframe id="atlas" title="游戏地图" allow="geolocation"></iframe><section id="card"><div id="meta"></div><button id="fold" aria-expanded="true" aria-controls="sheet"><span id="goal"></span><span aria-hidden="true" id="chevron">⌄</span></button><div id="sheet"><div id="actions"></div><section id="staff"></section><p id="response" role="status"></p></div><small id="status" role="status"></small></section></main>
<dialog id="decision"><h2 id="dialog-title"></h2><p id="detail"></p><div id="decision-actions"></div><button id="back">返回地图</button></dialog><dialog id="settings"><h2>本局房间</h2><p id="roomCode"></p><button id="invite">复制玩家邀请链接</button><button id="observe" hidden>复制观察席邀请链接</button><details><summary>本局规则</summary><p>男孩先找工人商量路线。走铁丝网会受伤，入关后两人再次会合，工人可分次使用共 20 分钟庇护。受伤期间，即使开启庇护，黑点也可能短暂出现。</p><p>乘车入关由两人合付 50 元。司机守约期间黑点隐藏，承认载客则暴露。查验区外完成交付，正常通关抵港才算男孩获胜。</p></details><button id="leave">返回入口</button><button id="close">关闭</button></dialog><output id="notice" role="status"></output></body></html>
